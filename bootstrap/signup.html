<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background: linear-gradient( #74ABE2, #5563DE);
      height: 100vh;
      display: flex;
      align-items: center;
    }
    .signup {
      background-color: #fff;
      border-radius: 15px;
      padding: 2rem;
      width: 100%;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="signup">
    <h2>Signup</h2>
    <form>
      <div class="row mb-3">
        <div class="col">
          <label for="fname" class="form-label">First Name</label>
          <input type="text" id="fname" class="form-control" placeholder="Enter first name" required>
        </div>
        <div class="col">
          <label for="mname" class="form-label">Middle Name</label>
          <input type="text" id="mname" class="form-control" placeholder="Enter middle name">
        </div>
      </div>

      <div class="mb-3">
        <label for="lname" class="form-label">Last Name</label>
        <input type="text" id="lname" class="form-control" placeholder="Enter last name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
      </div>

      <div class="mb-3">
        <label for="mobile" class="form-label">Mobile</label>
        <input type="tel" id="mobile" class="form-control" placeholder="Enter mobile number" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
      </div>

      <div class="mb-3">
        <label for="cpassword" class="form-label">Confirm Password</label>
        <input type="password" id="cpassword" class="form-control" placeholder="Confirm password" required>
      </div>

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="terms" required>
        <label class="form-check-label" for="terms">
          I agree to the <a href="#" class="text-decoration-none">Terms & Conditions</a>
        </label>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Register</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
