<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexible</title>

    <style>

        h2{
            background-color: violet;
            text-align: center;
            padding: 30px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        .container{
            display: flex;
            font-size: 40px;
        }

        .box1{
            background-color: orange;
            padding: 10px;
            text-align: center;
            width: 50%;
            font-size: 30px;
        }

        .box2{
            background-color: aqua;
            padding: 20px;
            text-align: center;
            width: 50%;
        }

        .box3{
            background-color: blanchedalmond;
            padding: 30px;
            text-align: center;
            width: 50%;
        
        }


    </style>
</head>
<body>

    <h2>Fluid Grid Layout</h2>

  

    <div class="container">

        <div class="box1" id="box">box 1</div>
        <div class="box2" id="box">box 2</div>
        <div class="box3" id="box">box 3</div>

    </div>

   

    
</body>
</html>
