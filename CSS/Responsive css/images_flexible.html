<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fexible </title>
    <style>
        h2 {
            background-color: grey;
        }

        .container img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        .box1 {
            flex: 1;
            text-align: center;
            padding: 20px;
            font-size: 1.5em;
            background-color: rgb(87, 91, 84);
        }

        .box2 {
            flex: 1;
            text-align: center;
            padding: 20px;
            font-size: 1.5em;
            background-color: rgb(245, 143, 10);
        }

        .box3 {
            flex: 1;
            text-align: center;
            padding: 20px;
            font-size: 1.5em;
            background-color: rgb(245, 10, 167);
        }

        .container img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            background-color: white;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h2>Fluid Grid Layout</h2>
    <div class="container">
        <div class="box1">
            <img src="img1.jpg" alt="abc">
        </div>
        <div class="box2">
            <img src="asd.JPG" alt="pqr">
        </div>
        <div class="box3">
            <img src="ad.JPG" alt="xyz">
        </div>
    </div>

</body>

</html>
