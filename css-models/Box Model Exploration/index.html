<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Exploration</title>
  <link rel="stylesheet" href="boxmodel.css">
</head>
<body>
  <h1>Box Model Exploration</h1>

  <div class="container">
    <div class="box default-box">
      <h2>Default Box Model</h2>
      <p>This box uses the default <strong>content-box</strong> model where width and height apply only to the content area.</p>
    </div>

    <div class="box border-box">
      <h2>Border-Box Model</h2>
      <p>This box uses <strong>box-sizing: border-box</strong>, meaning padding and border are included within the total width and height.</p>
    </div>
  </div>
</body>
</html>
