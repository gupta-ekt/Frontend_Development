<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth Effect Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Shadows and Depth Effect Layout</h1>
  <div class="container">
    <div class="card card1">
      <h2>Card One</h2>
      <p>This card has a soft shadow for a light floating effect.</p>
    </div>
    <div class="card card2">
      <h2>Card Two</h2>
      <p>This card uses a medium shadow to create more depth.</p>
    </div>
    <div class="card card3">
      <h2>Card Three</h2>
      <p>This card has a strong shadow for a bold depth effect.</p>
    </div>
  </div>
</body>
</html>
